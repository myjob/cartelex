# --------- Courts --------------
- target_fact_name: is_court_involved
  question: Court
  output_schema: ""
  pipeline: keyword_search
  force_override: false
  run_state_active: false

- target_fact_name: court_list_raw
  question: List all courts with assessment, order, ruling, decision or judgement?
  output_schema: "court, country, jurisdiction"
  pipeline: "router"
  predecessors:
    - is_court_involved
  condition: 'is_court_involved == true'
  force_override: false
  run_state_active: false


- target_fact_name: court_list
  question: |
    ### Strict Normalization Rules:
    1. Identify and Resolve Hierarchy: Look past typos, informal shorthand, and generic descriptions (e.g., "Danish court"). If an entry is a generic reference or a distinct subdivision of another court in the list (e.g., "High Court of Justice" vs. "High Court of Justice, Chancery Division"), merge them into the most specific, accurate institutional name provided.
    2. Standardize Court Names: Output the official, formal name of the court for the final row. Remove extraneous contextual words (e.g., "litigation", "case", or specific party names like "Lagap").
    3. Normalize Country and Jurisdiction: Ensure absolute consistency in these columns. Resolve synonyms and variations to a single, standardized format (e.g., standardize "Great Britain", "England", and "UK" to Country: "United Kingdom" / Jurisdiction: "UK" or "England & Wales" depending on your target schema).
    4. Smart Deduplication (Do Not Over-Merge): Merge entries ONLY if they represent the exact same judicial body. Do not merge courts of different judicial levels (e.g., Trial/District courts vs. Appellate/Supreme courts) simply because they share a jurisdiction. When resolving duplicates, favor merging up to the correct specific division rather than collapsing entirely different courts together.
  output_schema: "court, country, jurisdiction"
  pipeline: fact_context
  predecessors:
    - court_list_raw
  condition: "'court' in court_list_raw"
  force_override: false
  run_state_active: false

