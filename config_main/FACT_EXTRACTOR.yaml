# -- Fines --
- target_fact_name: fines
  question: List all fines
  output_schema: company, amount
  # Golden list for verification: resolved by fact NAME against the facts table,
  # unlike output_schema above, which names the JSON row key. The retired
  # `company` fact resolved empty, silently disabling verification.
  verify_fact_name: companies_investigated
  pipeline: universal
  predecessors: ["companies_investigated"]
  # Restrict retrieval to the sections where amounts and orders live
  # (section_type metadata from Main_classify_sections.py).
  section_scope: [fines, operative]
  run_state_active: false

# -- companies --
- target_fact_name: companies_investigated
  # Frame as "parties/addressees whose conduct the Commission assessed" rather
  # than "under investigation": the latter deterministically excludes the party
  # in exemption / negative-clearance / notification decisions and biases the
  # model against trade or professional associations (e.g. CELEX-31987D0013,
  # CELEX-31985D0564), yielding a spurious NA.
  question: |
    List the undertakings, companies, or associations named as parties of this
    decision (the entities whose conduct or agreements the Commission assessed).
    Include trade or professional associations.
    Output rules:
    - Emit ONE row per individual legal entity. Never combine several entities
      into one row. Where the text names a parent "and its subsidiaries: X, Y, Z",
      emit a separate row for the parent and one for each of X, Y and Z.
    - The `companies` value is the legal name ONLY. Copy it exactly as written
      and STOP at the end of the name. Do not append street, postal code, city,
      region or country, and do not append a country parenthetical:
      "Hansa Metallwerke AG (Germany)" -> "Hansa Metallwerke AG"
      "Astral, Société de Peintures, Vernis et Encres d'Imprimerie, Paris, France"
      -> "Astral, Société de Peintures, Vernis et Encres d'Imprimerie"
    - Keep a comma that belongs to the name itself; drop a comma that introduces
      an address.
    - Keep the legal-form suffix (AG, GmbH, S.A., B.V., Ltd) and any parenthesised
      acronym that is the entity's own abbreviation, e.g. "(ACIMIT)".
    - Put any location text in `location`; use "NA" when the text gives none.
  output_schema: companies, location
  pipeline: universal
  force_override: false
  run_state_active: false



- target_fact_name: company_recidivism
  question: |
    Analyze this behavior under EU competition law (Articles 101, 102, or 106 TFEU, or their predecessors). 
    Has this specific undertaking engaged in similar anti-competitive behavior in the past, constituting recidivism?
    Constraint: Reply strictly with 'True', 'False', or 'NA' (if no public information is available).
  output_schema: companies,recidivism
  pipeline: universal
  predecessors: ["companies_investigated"]
  force_override: false
  run_state_active: false


- target_fact_name: companies_country
  question: for all companies, what is their ISO country code ?
  output_schema: "companies_investigated, country"
  predecessors: ["companies_investigated"]
  # Dependent fact: the ISO country code is derived per company from the
  # authoritative companies_investigated list. The `universal` (hybrid-search)
  # pipeline ignores predecessors and re-derives companies from retrieved
  # chunks, so a retrieval miss silently drops companies (and their country).
  # `fact_context` feeds companies_investigated straight to the extractor.
  pipeline: fact_context
  # ISO 3166-1 is a closed vocabulary; canonicalize the extracted country
  # deterministically (Germany/de/DEU/Deutschland -> DE) instead of trusting
  # the LLM to format the code. Unresolvable values are kept as-is.
  normalize_iso_country: true
  force_override: false
  run_state_active: false


- target_fact_name: companies_address
  question: What is the registered address of this company ?
  # detail_retriever: per-entity enrichment. The companies_investigated rows
  # define the entity roster; each company gets its own targeted search
  # (keyword first, hybrid fallback) plus its own extraction call, so no
  # company is silently dropped by a retrieval miss. The FIRST schema key
  # carries the entity name; missing details come back as 'NA'.
  output_schema: "company,  address"
  predecessors: ["companies_investigated"]
  pipeline: detail_retriever
  # Registered/postal addresses live in the decision's addressee block
  # (the operative section), not the "undertakings concerned" recitals which
  # only give a city. Scope per-entity retrieval there so the full address is
  # surfaced instead of a narrative "based in <city>" mention.
  section_scope: [operative]
  force_override: false
  run_state_active: false

  
