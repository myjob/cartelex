# yaml-language-server: $schema=schema.json

# YAML 1.2 (stricter, used by newer parsers like ruamel.yaml): Only true and false
# pipeline: universal, fact_context, keyword_search, hybrid_search,  fact_comparison
# book pipelines: book_keywords, book_infringement_type, book_universal
# heideltime pipelines: heideltime_raw (JAR extraction), heideltime_event (LLM enrichment)
# output_schema: "str" means the output is a string even if the LLM returns a dictionary or list; empty string goes to MD of dict or list in value_md
#!! could add topic groups which allows to run multiple facts in one go
# concerning runtime, if a dependency is set to run_state and force_override = true, those will be re computed as well

# --------- Summary  --------------
# filter for 'Article 85', 'Article 86', 'Article 90', 'Article 81', 'Article 82', 'Article 86', 'Article 101', 'Article 102', 'Article 106'

# context_facts is the summary's input allow-list, in reading order. Unlike
# predecessors it never gates: an absent fact (e.g. leniency_granted in a
# non-leniency case) is skipped. Every name must be a target_fact_name of this
# catalog (test_fact_extractor_yaml_integrity), so a retired fact can no longer
# leak into the summary from stale DB rows. A stored summary is rebuilt when
# the value of any of these facts changed after it (an unchanged
# re-extraction keeps facts.created_at). Raw/intermediate facts
# (heideltime_raw, heideltime_event, court_list_raw, companies_address,
# leniency_case_match) are left out on purpose.
- target_fact_name: case_summary
  question: "Summarize the case into topics"
  output_schema: ""
  pipeline: case_summary
  context_facts:
    - celex_case_id
    - case_title
    - eu_commission_decision_date
    - cartel_period
    - case_commissioner
    - companies_investigated
    - companies_country
    - companies_industry
    - products
    - OECD_sector
    - NACE_group_code
    - NACE_class_code
    - market_geographical
    - market_outside_eu
    - market_oligopoly
    - market_turbulence
    - law_article_operative
    - law_article_all_relevant
    - infringement_concept
    - infringement_category_procedural
    - infringement_category_member_states
    - infringement_category_abuse_of_dominance
    - infringement_category_hor_vert_lic_joint
    - infringement_subcategory_horizontal_restraints
    - infringement_subcategory_vertical_restraints
    - infringement_gravity
    - cartel_period
    - heideltime_event_agg
    - exemption_case
    - exemption_applicants
    - leniency_case
    - leniency_applicants
    - leniency_granted
    - leniency_rejected
    - fines
    - decision_remedies
    - company_recidivism
    - case_commission_info_request
    - case_commission_no_action
    - case_commission_infringement
    - case_commission_decision
    - is_court_involved
    - court_list
    - case_is_in_book
    - case_is_landmark_in_book
    - case_infringement_type_book
    - case_infringement_book
  force_override: true
  run_state_active: true

# --------- Law --------------
# filter for 'Article 85', 'Article 86', 'Article 90', 'Article 81', 'Article 82', 'Article 86', 'Article 101', 'Article 102', 'Article 106'
- target_fact_name: law_article_all_relevant
  question: 'Article \d+'
  output_schema: ""
  pipeline: keyword_regex
  force_override: false
  run_state_active: false

# The articles the decision actually applies: the same regex restricted to
# chunks classified as the operative part ("HAS ADOPTED THIS DECISION ...
# Article 1"). The classification conditions below read this fact first and
# fall back to law_article_all_relevant, so a passing narrative mention of
# Article 85 in an Article 86 abuse case no longer asks the cartel questions.
- target_fact_name: law_article_operative
  question: 'Article \d+'
  output_schema: ""
  pipeline: keyword_regex
  section_scope: [operative]
  force_override: false
  run_state_active: false

# Canonical infringement concept(s) derived deterministically from
# law_article_all_relevant, mapped across the EU treaty renumbering (EEC/EC/TFEU)
# using the decision date with a CELEX-year fallback. Materialized for the book
# cross-check and audit; the same normalizer backs the same_concept(...) gating
# conditions below. No predecessors by design: the inputs are read best-effort so
# a non-competition document never halts the pipeline.
- target_fact_name: infringement_concept
  question: "Canonical EU infringement concept(s) per treaty renumbering, derived from law_article_all_relevant"
  output_schema: ""
  output_type: str
  pipeline: infringement_concept
  force_override: false
  run_state_active: false

# Highest recital number of the decision, for corpus statistics. Deterministic
# (pipelines/legal/recital_count.py): longest +1..+gap chain of line-start (n)
# numbers, dot-numbered paragraphs "n." as fallback for older decisions. Reads
# the ingested markdown first, chunks only when no file exists. value_json
# carries the max with coverage, status (confident/doubtful/undetermined) and
# provenance so doubtful values can be filtered out.
- target_fact_name: recitals_max
  question: "Highest recital number of the decision, from line-start (n) or n. numbering"
  output_schema: ""
  output_type: dict
  pipeline: recital_count
  force_override: false
  run_state_active: false

# --------- infringements --------------

- target_fact_name: infringement_category_procedural
  question: |
    Task: Classify the provided text based on the legal concept of "Failure to Supply Information."
    Definition: This occurs when the Commission requests information under its legal authority, but the undertaking refuses to provide it, provides incomplete data, or provides misleading information.
    Classification Rules:
    * Reply 'True' if the text describes an undertaking refusing or failing to provide accurate/complete information to the Commission.
    * Reply 'False' if the text describes full cooperation or a situation unrelated to a refusal of information.
    * Reply 'NA' if there is no mention of a request for information or the behavior of an undertaking.
  output_schema: ""
  output_type: str
  pipeline: universal
  condition: |
    exists("law_article_all_relevant") and same_concept('public_undertaking', 'law_article_operative')
  force_override: false
  run_state_active: false

- target_fact_name: infringement_category_member_states
  question: |
    Task: Determine if the legal action described is brought against an EU Member State regarding the overruling of EU competition law.
    Definition: Cases where a Member State is the subject of the proceeding because its national laws or actions interfere with, overrule, or conflict with EU competition rules.
    Decision Logic:
      True: The case is specifically against a Member State (or national authority) for failing to comply with or overruling EU law.
      False: The case is against a private company (undertaking) or involves a different legal issue.
      NA: The provided text contains no information about the parties involved or the nature of the legal action.
  output_schema: ""
  output_type: str
  pipeline: universal
  condition: |
    exists("law_article_all_relevant") and same_concept('public_undertaking', 'law_article_operative')
  force_override: false
  run_state_active: false

- target_fact_name: infringement_category_abuse_of_dominance
  question: |
    Task: Classify the following case based on the definition of "Abuse of Dominance."
    Definition: A company with significant market power unfairly exploits its position to restrict competition, eliminate rivals, or harm consumers, rather than competing fairly on the merits of its products or services.
    Constraint: reply with 'True' or 'False', or 'NA' if no information is provided. Do not include any other text or the category name.
  output_schema: ""
  output_type: str
  pipeline: universal
  condition: |
    exists("law_article_all_relevant") and same_concept('abuse_of_dominance', 'law_article_operative')
  force_override: false
  run_state_active: false

- target_fact_name: infringement_category_hor_vert_lic_joint
  question: |
    Is this case about: 
    * agreements between competing firms operating at the same market level? reply 'horizontal', 
    * or transfer of rights to exploit Intellectual Property Rights? reply 'license',
    * or agreements between companies at different levels of the supply chain? reply 'vertical'
    * or joint ventures and alliances involving coordination of activities? reply 'joint venture'.
    Constraint: Reply with only the best fitting category name or 'NA'. Do not include introductory text or punctuation.
  output_schema: ""
  output_type: str
  pipeline: universal
  condition: |
    exists("law_article_all_relevant") and same_concept('anticompetitive_agreement', 'law_article_operative')
  force_override: false
  run_state_active: false

- target_fact_name: infringement_subcategory_horizontal_restraints
  question: |
    Task: Classify the business behavior provided below into the correct subcategory of Horizontal Restraints.
    Definition: Horizontal restraints are agreements between companies operating at the same level of the supply chain.  
    Select the matching subcategories 
    * price fixing collusion
    * market sharing, quota cartels, and specialization agreements
    * bid-rigging and tender fixing
    * structural crisis cartels
    * export cartels
    * trade associations
    * marketing and advertising agreements
    * agreements on standards 
    * exchange of information on prices and sales
    Constraint: Your final answer must be the matching category name(s) on one line, separated by "; ", or "NA" if no restraint is found. Do not use a table, a list or any other text.
  output_schema: ""
  output_type: str
  pipeline: universal
  condition: "'horizontal' in infringement_category_hor_vert_lic_joint"
  force_override: false
  run_state_active: false

- target_fact_name: infringement_subcategory_vertical_restraints
  question: |
    Task: Classify the business behavior provided below into the correct subcategory of vertical restraint.
    # Categories:
    * Exclusive Dealing / Market Foreclosure: Obligations requiring a buyer to purchase only from one supplier.
    * Territorial Exclusivity / Parallel Trade Bans: Restricting where a buyer can sell or preventing cross-border trade.
    * Resale Price Maintenance (RPM): Establishing fixed or minimum resale prices.
    * Bundling and Tying: Making the sale of one product conditional on the purchase of another.
    * Selective Distribution: Restricting sales to authorized distributors based on specific criteria.
    * Franchising: Licenses for IP/business models combined with vertical restrictions.
    * Discounts and Rebates: Financial incentives that may result in loyalty or exclusivity.
    Constraint: Your final answer must be the matching category name(s) on one line, separated by "; ", or "NA" if no restraint is found. Do not use a table, a list or any other text.
  output_schema: ""
  output_type: str
  pipeline: universal
  condition: "'vertical' in infringement_category_hor_vert_lic_joint"
  force_override: false
  run_state_active: false

- target_fact_name: market_oligopoly
  question: |
    Is the market dominated by a small number of large players (oligopoly) in the market?  
    # Constraint: reply with 'True' or 'False' or 'NA' in no info is provided .
  output_schema: ""
  pipeline: universal
  force_override: false
  run_state_active: false


- target_fact_name: decision_remedies
  question: "What orders did the Commission issue to terminate the infringement? List all remedies and orders, such as cease and desist orders, structural remedies (e.g., divestitures), behavioral remedies (e.g., commitments to change business practices) per company."
  output_schema: ""
  output_type: str
  pipeline: universal
  force_override: false
  run_state_active: false

- target_fact_name: infringement_gravity
  question: "How severe is the infringement? respond with one of the following categories: low, medium, high, NA. Consider factors such as the duration of the infringement, the market share of the involved companies, and the potential harm to consumers."
  output_schema: ""
  output_type: str
  pipeline: universal
  force_override: false
  run_state_active: false

# --------- book --------------
- target_fact_name: case_is_in_book
  question: "case id's is mentioned in the book"
  output_schema: ""
  output_type: str
  predecessors: []
  pipeline: book_keywords
  force_override: false
  run_state_active: false

- target_fact_name: case_is_landmark_in_book
  question: "case id's is mentioned in the book"
  output_schema: ""
  output_type: str
  predecessors: []
  condition: 'exists("case_is_in_book") '
  pipeline: book_landmark
  force_override: false
  run_state_active: false

- target_fact_name: case_infringement_type_book
  question: "cut from input the numbers and special characters from the and return as the infringement of case"
  output_schema: ""
  output_type: str
  predecessors: [case_is_in_book]
  condition: 'exists("case_is_in_book")'
  pipeline: book_infringement_type
  force_override: false
  run_state_active: false

- target_fact_name: case_infringement_book
  question: "infringement of case"
  output_schema: ""
  output_type: str
  predecessors: [case_is_in_book]
  condition: 'exists("case_is_in_book")'
  pipeline: book_universal
  force_override: false
  run_state_active: false

# --------- NACE --------------
- target_fact_name: NACE_class_code
  question: "determine NACE class code for given product and NACE group code"
  output_schema: ""
  output_type: str
  predecessors: ["products", "NACE_group_code"]
  pipeline: nace_class_code
  force_override: false
  run_state_active: false

- target_fact_name: NACE_group_code
  # Shortlist-then-pick (NaceModule, level=group): the reranker ranks all NACE
  # 2.1 classes against case_title + products, the LLM picks one of the top
  # settings.NACE_SHORTLIST_TOP_K, and its parent group is stored as
  # '<code>:<title>'. The NACE list comes from settings.NACE_JSON_PATH.
  question: "Classify the economic activity of the market concerned by the infringement into one NACE class."
  output_schema: ""
  output_type: str
  predecessors: ["products"]
  pipeline: nace_group_code
  force_override: false
  run_state_active: false

- target_fact_name: OECD_sector
  question: "Which economic sector is involved? Choose the most fitting out of the following 10 OECD sectors:\nagriculture; \nmining;\nmanufacturing; \nelectricity and gas; \nconstruction; \ntrade (wholesaling and retailing) and hotels; \ntransport; \nbanking and insurance (including real estate); \ncommunication;\npublic service"
  output_schema: ""
  output_type: str
  predecessors: ["products"]
  # Classifies the sector FROM the products list (like its sibling
  # NACE_group_code). The `universal` pipeline ignores predecessors and does a
  # doc search instead, so the products context never reaches the LLM;
  # `fact_context` feeds it directly.
  pipeline: fact_context
  force_override: false
  run_state_active: false

# --------- market --------------
- target_fact_name: market_turbulence
  question: list market turbulence and uncertainties, if mentioned in the document. This includes any references to market volatility, economic instability, or other factors that could impact the competitive landscape. reply with "NA" if no market turbulence or uncertainties are mentioned.
  output_schema: "market_turbulence"
  output_type: str
  pipeline: universal
  force_override: false
  run_state_active: false

- target_fact_name: market_geographical
  question: In which countries is the geographical market located?
  output_schema: "country"
  pipeline: universal
  force_override: false
  run_state_active: false

- target_fact_name: market_outside_eu
  question: Is the geographical market including non European community members?
  predecessors: ["market_geographical"]
  output_schema: "bool"
  pipeline: "fact_context"
  force_override: false
  run_state_active: false

- target_fact_name: products
  # 'products' means goods OR services of the relevant product market (as in
  # CPA/NACE); it is the sole input of NACE_group_code and OECD_sector.
  question: list all goods and services concerned by the infringement, i.e. the relevant product market
  output_schema: products
  pipeline: universal
  # When the decision text yields no product, infer it from the stored
  # case_title (titles usually name the product market, e.g. 'Industrial bags',
  # or a company whose goods/services are then used, e.g. 'MasterCard II').
  na_fallback_fact: case_title
  force_override: false
  run_state_active: false


#-- LENIENCY

- target_fact_name: exemption_case
  question: exemption
  output_schema: ""
  pipeline: keyword_search
  force_override: false
  run_state_active: false

- target_fact_name: exemption_applicants
  question: Which companies applied for exemption?
  output_schema: "company"
  pipeline: universal
  predecessors: ["companies_investigated", "exemption_case"]
  condition: 'exists("exemption_case") and exemption_case == true'
  force_override: false
  run_state_active: false

- target_fact_name: leniency_case
  question: leniency
  output_schema: ""
  pipeline: keyword_search
  force_override: false
  run_state_active: false

- target_fact_name: leniency_case_match
  question: Are both facts similar? Ignore formatting differences, abbreviations, unit placements, casing, and minor stylistic variations.
  output_schema: bool
  predecessors: ["leniency_case"]
  pipeline: fact_comparison
  force_override: false
  run_state_active: false

- target_fact_name: leniency_applicants
  question: Which companies submitted a leniency application?
  output_schema: "company"
  pipeline: universal
  predecessors: ["companies_investigated", "leniency_case"]
  condition: 'exists("leniency_case") and leniency_case == true'
  force_override: false
  run_state_active: false

- target_fact_name: leniency_granted
  question: Which companies got which amount fine reduction?
  output_schema: "company, amount"
  pipeline: universal
  predecessors: ["companies_investigated", "leniency_case", "leniency_applicants"]
  condition: 'exists("leniency_case") and leniency_case == true'
  force_override: false
  run_state_active: false

- target_fact_name: leniency_rejected
  question: Identify which companies from the leniency_applicants list are NOT present in the leniency_granted list. Ignore company names suffixes like "S.A.", "SA", "AG", "GmbH", etc. ?
  output_schema: "company"
  pipeline: "hybrid_search"
  predecessors:
    ["companies_investigated", "leniency_case", "leniency_applicants", "leniency_granted"]
  force_override: false
  condition: 'exists("leniency_case") and leniency_case == true'
  run_state_active: false

# -- Fines --
- target_fact_name: fines
  question: List all fines
  output_schema: company, amount
  # Golden list for verification: resolved by fact NAME against the facts table,
  # unlike output_schema above, which names the JSON row key. The retired
  # `company` fact resolved empty, silently disabling verification.
  verify_fact_name: companies_investigated
  pipeline: universal
  predecessors: ["companies_investigated"]
  # Restrict retrieval to the sections where amounts and orders live
  # (section_type metadata from Main_classify_sections.py).
  section_scope: [fines, operative]
  run_state_active: false

# -- companies --
- target_fact_name: companies_investigated
  # Frame as "parties/addressees whose conduct the Commission assessed" rather
  # than "under investigation": the latter deterministically excludes the party
  # in exemption / negative-clearance / notification decisions and biases the
  # model against trade or professional associations (e.g. CELEX-31987D0013,
  # CELEX-31985D0564), yielding a spurious NA.
  question: |
    List the undertakings, companies, or associations named as parties of this
    decision (the entities whose conduct or agreements the Commission assessed).
    Include trade or professional associations.
    Output rules:
    - Emit ONE row per individual legal entity. Never combine several entities
      into one row. Where the text names a parent "and its subsidiaries: X, Y, Z",
      emit a separate row for the parent and one for each of X, Y and Z.
    - The `companies` value is the legal name ONLY. Copy it exactly as written
      and STOP at the end of the name. Do not append street, postal code, city,
      region or country, and do not append a country parenthetical:
      "Hansa Metallwerke AG (Germany)" -> "Hansa Metallwerke AG"
      "Astral, Société de Peintures, Vernis et Encres d'Imprimerie, Paris, France"
      -> "Astral, Société de Peintures, Vernis et Encres d'Imprimerie"
    - Keep a comma that belongs to the name itself; drop a comma that introduces
      an address.
    - Keep the legal-form suffix (AG, GmbH, S.A., B.V., Ltd) and any parenthesised
      acronym that is the entity's own abbreviation, e.g. "(ACIMIT)".
    - Put any location text in `location`; use "NA" when the text gives none.
  output_schema: companies, location
  pipeline: universal
  force_override: false
  run_state_active: false

# Number of distinct legal units (companies, subsidiaries named individually,
# trade/professional associations) the decision assessed. Deterministic
# (pipelines/legal/undertaking_count.py): counts the companies_investigated
# roster rows, deduplicated on the company stem so "Akzo Chemicals BV" and
# "Akzo Chemicals" count once. value_json carries the count, the counted names
# and the pre-dedupe row count. Legal units, not EU-law economic units: a parent
# and its separately named subsidiaries count individually.
- target_fact_name: number_undertaking
  question: "Number of distinct legal units (companies, associations) assessed, from companies_investigated"
  output_schema: ""
  output_type: dict
  pipeline: undertaking_count
  predecessors: ["companies_investigated"]
  condition: 'exists("companies_investigated")'
  force_override: false
  run_state_active: false



- target_fact_name: company_recidivism
  question: |
    Analyze this behavior under EU competition law (Articles 101, 102, or 106 TFEU, or their predecessors). 
    Has this specific undertaking engaged in similar anti-competitive behavior in the past, constituting recidivism?
    Constraint: Reply strictly with 'True', 'False', or 'NA' (if no public information is available).
  output_schema: companies,recidivism
  pipeline: universal
  predecessors: ["companies_investigated"]
  force_override: false
  run_state_active: false


- target_fact_name: companies_country
  question: for all companies, what is their ISO country code ?
  output_schema: "companies_investigated, country"
  predecessors: ["companies_investigated"]
  # Dependent fact: the ISO country code is derived per company from the
  # authoritative companies_investigated list. The `universal` (hybrid-search)
  # pipeline ignores predecessors and re-derives companies from retrieved
  # chunks, so a retrieval miss silently drops companies (and their country).
  # `fact_context` feeds companies_investigated straight to the extractor.
  pipeline: fact_context
  # ISO 3166-1 is a closed vocabulary; canonicalize the extracted country
  # deterministically (Germany/de/DEU/Deutschland -> DE) instead of trusting
  # the LLM to format the code. Unresolvable values are kept as-is.
  normalize_iso_country: true
  force_override: false
  run_state_active: false


- target_fact_name: companies_address
  question: What is the registered address of this company ?
  # detail_retriever: per-entity enrichment. The companies_investigated rows
  # define the entity roster; each company gets its own targeted search
  # (keyword first, hybrid fallback) plus its own extraction call, so no
  # company is silently dropped by a retrieval miss. The FIRST schema key
  # carries the entity name; missing details come back as 'NA'.
  output_schema: "company,  address"
  predecessors: ["companies_investigated"]
  pipeline: detail_retriever
  # Registered/postal addresses live in the decision's addressee block
  # (the operative section), not the "undertakings concerned" recitals which
  # only give a city. Scope per-entity retrieval there so the full address is
  # surfaced instead of a narrative "based in <city>" mention.
  section_scope: [operative]
  force_override: false
  run_state_active: false

  
- target_fact_name: companies_industry
  question: list the industries
  output_schema: "industry"
  pipeline: universal
  run_state_active: false

#-- Events 
  # currently celex_facts.heideltime_extractions
- target_fact_name: heideltime_raw
  question: "Create a chronological, deduplicated timeline of case-specific events"
  output_schema: ""
  pipeline: heideltime_raw
  force_override: false
  run_state_active: false

# -- HeidelTime Event Enrichment --------------
- target_fact_name: heideltime_event
  question: "Extract structured events (actor, predicate-object) for each canonical HeidelTime date found in the document"
  output_schema: "event, actor, predicate_object"
  pipeline: heideltime_event
  predecessors:
    - heideltime_raw
  force_override: false
  run_state_active: false

- target_fact_name: heideltime_event_agg
  question: "Analyze the following input and extract up to 12 critical events spanning the whole case: always the earliest conduct event (agreement concluded, cartel creation), the last conduct event, and the final outcome (decision, fines). skip any trivia"
  output_schema: "event, actor, predicate_object"
  pipeline: heideltime_event_agg
  predecessors:
    - heideltime_event
  force_override: false
  run_state_active: false


- target_fact_name: cartel_period
  question: "Analyze the provided event text to find the **global start date** and **global end date** of the company's infringement (cartel period)."
  output_schema: "start_date, end_date"
  pipeline: heideltime_cartel_period
  predecessors:
    - heideltime_event
  # Exemption, negative-clearance and Article 9 commitments decisions carry an
  # exemption or commitment term, not a cartel period (ISSUES #high 20261105).
  # Only an explicit False suppresses the period; NA or a missing gate fact
  # keeps it. The gate is an ordering-only context fact, never a predecessor:
  # an NA predecessor counts as unfulfilled and would skip the period outright.
  context_facts:
    - case_commission_infringement
  condition: 'not exists("case_commission_infringement") or case_commission_infringement != false'
  force_override: false
  run_state_active: false

# -- events --
# Read from the decision's own "Done at Brussels, <date>" line, else its title
# (ISSUES #369, review A26). The aggregated events are only the LLM fallback for
# a text that states no date, so they are an ordering-only context fact: as a
# predecessor a missing or NA event list would skip or blank the date. The
# question is the fallback's prompt.
- target_fact_name: eu_commission_decision_date
  question: "When did the EU commission decided this case? Reply with date format YYYY-MM-DD or NA"
  context_facts:
    - heideltime_event_agg
  output_schema: "str"
  pipeline: "decision_date"
  force_override: false
  run_state_active: false


# ----------------------------------------------------------------------------------
# --------- Courts --------------
- target_fact_name: is_court_involved
  question: Court
  output_schema: ""
  pipeline: keyword_search
  force_override: false
  run_state_active: false

- target_fact_name: court_list_raw
  question: List all courts with assessment, order, ruling, decision or judgement?
  output_schema: "court, country, jurisdiction"
  pipeline: "router"
  predecessors:
    - is_court_involved
  condition: 'is_court_involved == true'
  force_override: false
  run_state_active: false


- target_fact_name: court_list
  question: |
    ### Strict Normalization Rules:
    1. Identify and Resolve Hierarchy: Look past typos, informal shorthand, and generic descriptions (e.g., "Danish court"). If an entry is a generic reference or a distinct subdivision of another court in the list (e.g., "High Court of Justice" vs. "High Court of Justice, Chancery Division"), merge them into the most specific, accurate institutional name provided.
    2. Standardize Court Names: Output the official, formal name of the court for the final row. Remove extraneous contextual words (e.g., "litigation", "case", or specific party names like "Lagap").
    3. Normalize Country and Jurisdiction: Ensure absolute consistency in these columns. Resolve synonyms and variations to a single, standardized format (e.g., standardize "Great Britain", "England", and "UK" to Country: "United Kingdom" / Jurisdiction: "UK" or "England & Wales" depending on your target schema).
    4. Smart Deduplication (Do Not Over-Merge): Merge entries ONLY if they represent the exact same judicial body. Do not merge courts of different judicial levels (e.g., Trial/District courts vs. Appellate/Supreme courts) simply because they share a jurisdiction. When resolving duplicates, favor merging up to the correct specific division rather than collapsing entirely different courts together.
  output_schema: "court, country, jurisdiction"
  pipeline: fact_context
  predecessors:
    - court_list_raw
  condition: "'court' in court_list_raw"
  force_override: false
  run_state_active: false

