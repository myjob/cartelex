# yaml-language-server: $schema=schema.json

# YAML 1.2 (stricter, used by newer parsers like ruamel.yaml): Only true and false
# pipeline: universal, fact_context, keyword_search, hybrid_search,  fact_comparison
# book pipelines: book_keywords, book_infringement_type, book_universal
# heideltime pipelines: heideltime_raw (JAR extraction), heideltime_event (LLM enrichment)
# output_schema: "str" means the output is a string even if the LLM returns a dictionary or list; empty string goes to MD of dict or list in value_md
#!! could add topic groups which allows to run multiple facts in one go
# concerning runtime, if a dependency is set to run_state and force_override = true, those will be re computed as well

# --------- Summary  --------------
# filter for 'Article 85', 'Article 86', 'Article 90', 'Article 81', 'Article 82', 'Article 86', 'Article 101', 'Article 102', 'Article 106'

# context_facts is the summary's input allow-list, in reading order. Unlike
# predecessors it never gates: an absent fact (e.g. leniency_granted in a
# non-leniency case) is skipped. Every name must be a target_fact_name of this
# catalog (test_fact_extractor_yaml_integrity), so a retired fact can no longer
# leak into the summary from stale DB rows. A stored summary is rebuilt when
# any of these facts was written after it. Raw/intermediate facts
# (heideltime_raw, heideltime_event, court_list_raw, companies_address,
# leniency_case_match) are left out on purpose.
- target_fact_name: case_summary
  question: "Summarize the case into topics"
  output_schema: ""
  pipeline: case_summary
  context_facts:
    - celex_case_id
    - case_title
    - eu_commisssion_decision_date
    - case_commissioner
    - companies_investigated
    - companies_country
    - companies_industry
    - products
    - services
    - OECD_sector
    - NACE_group_code
    - NACE_class_code
    - market_geographical
    - market_outside_eu
    - market_oligopoly
    - market_turbulence
    - law_article_operative
    - law_article_all_relevant
    - infringement_concept
    - infringement_category_procedural
    - infringement_category_member_states
    - infringement_category_abuse_of_dominance
    - infringement_category_hor_vert_lic_joint
    - infringement_subcategory_horizontal_restraints
    - infringement_subcategory_vertical_restraints
    - infringement_gravity
    - heideltime_cartel_period
    - heideltime_event_agg
    - exemption_case
    - exemption_applicants
    - leniency_case
    - leniency_applicants
    - leniency_granted
    - leniency_rejected
    - fines
    - decision_remedies
    - company_recidivism
    - case_commission_info_request
    - case_commission_no_action
    - case_commission_decision
    - is_court_involved
    - court_list
    - case_is_in_book
    - case_is_landmark_in_book
    - case_infringement_type_book
    - case_infringement_book
  force_override: true
  run_state_active: true

# --------- Law --------------
# filter for 'Article 85', 'Article 86', 'Article 90', 'Article 81', 'Article 82', 'Article 86', 'Article 101', 'Article 102', 'Article 106'
- target_fact_name: law_article_all_relevant
  question: 'Article \d+'
  output_schema: ""
  pipeline: keyword_regex
  force_override: false
  run_state_active: false

# The articles the decision actually applies: the same regex restricted to
# chunks classified as the operative part ("HAS ADOPTED THIS DECISION ...
# Article 1"). The classification conditions below read this fact first and
# fall back to law_article_all_relevant, so a passing narrative mention of
# Article 85 in an Article 86 abuse case no longer asks the cartel questions.
- target_fact_name: law_article_operative
  question: 'Article \d+'
  output_schema: ""
  pipeline: keyword_regex
  section_scope: [operative]
  force_override: false
  run_state_active: false

# Canonical infringement concept(s) derived deterministically from
# law_article_all_relevant, mapped across the EU treaty renumbering (EEC/EC/TFEU)
# using the decision date with a CELEX-year fallback. Materialized for the book
# cross-check and audit; the same normalizer backs the same_concept(...) gating
# conditions below. No predecessors by design: the inputs are read best-effort so
# a non-competition document never halts the pipeline.
- target_fact_name: infringement_concept
  question: "Canonical EU infringement concept(s) per treaty renumbering, derived from law_article_all_relevant"
  output_schema: ""
  output_type: str
  pipeline: infringement_concept
  force_override: false
  run_state_active: false

# --------- infringements --------------

- target_fact_name: infringement_category_procedural
  question: |
    Task: Classify the provided text based on the legal concept of "Failure to Supply Information."
    Definition: This occurs when the Commission requests information under its legal authority, but the undertaking refuses to provide it, provides incomplete data, or provides misleading information.
    Classification Rules:
    * Reply 'True' if the text describes an undertaking refusing or failing to provide accurate/complete information to the Commission.
    * Reply 'False' if the text describes full cooperation or a situation unrelated to a refusal of information.
    * Reply 'NA' if there is no mention of a request for information or the behavior of an undertaking.
  output_schema: ""
  output_type: str
  pipeline: universal
  condition: |
    exists("law_article_all_relevant") and same_concept('public_undertaking', 'law_article_operative')
  force_override: false
  run_state_active: false

- target_fact_name: infringement_category_member_states
  question: |
    Task: Determine if the legal action described is brought against an EU Member State regarding the overruling of EU competition law.
    Definition: Cases where a Member State is the subject of the proceeding because its national laws or actions interfere with, overrule, or conflict with EU competition rules.
    Decision Logic:
      True: The case is specifically against a Member State (or national authority) for failing to comply with or overruling EU law.
      False: The case is against a private company (undertaking) or involves a different legal issue.
      NA: The provided text contains no information about the parties involved or the nature of the legal action.
  output_schema: ""
  output_type: str
  pipeline: universal
  condition: |
    exists("law_article_all_relevant") and same_concept('public_undertaking', 'law_article_operative')
  force_override: false
  run_state_active: false

- target_fact_name: infringement_category_abuse_of_dominance
  question: |
    Task: Classify the following case based on the definition of "Abuse of Dominance."
    Definition: A company with significant market power unfairly exploits its position to restrict competition, eliminate rivals, or harm consumers, rather than competing fairly on the merits of its products or services.
    Constraint: reply with 'True' or 'False', or 'NA' if no information is provided. Do not include any other text or the category name.
  output_schema: ""
  output_type: str
  pipeline: universal
  condition: |
    exists("law_article_all_relevant") and same_concept('abuse_of_dominance', 'law_article_operative')
  force_override: false
  run_state_active: false

- target_fact_name: infringement_category_hor_vert_lic_joint
  question: |
    Is this case about: 
    * agreements between competing firms operating at the same market level? reply 'horizontal', 
    * or transfer of rights to exploit Intellectual Property Rights? reply 'license',
    * or agreements between companies at different levels of the supply chain? reply 'vertical'
    * or joint ventures and alliances involving coordination of activities? reply 'joint venture'.
    Constraint: Reply with only the best fitting category name or 'NA'. Do not include introductory text or punctuation.
  output_schema: ""
  output_type: str
  pipeline: universal
  condition: |
    exists("law_article_all_relevant") and same_concept('anticompetitive_agreement', 'law_article_operative')
  force_override: false
  run_state_active: false

- target_fact_name: infringement_subcategory_horizontal_restraints
  question: |
    Task: Classify the business behavior provided below into the correct subcategory of Horizontal Restraints.
    Definition: Horizontal restraints are agreements between companies operating at the same level of the supply chain.  
    Select the matching subcategories 
    * price fixing collusion
    * market sharing, quota cartels, and specialization agreements
    * bid-rigging and tender fixing
    * structural crisis cartels
    * export cartels
    * trade associations
    * marketing and advertising agreements
    * agreements on standards 
    * exchange of information on prices and sales
    Constraint: Your final answer must be the matching category name(s) on one line, separated by "; ", or "NA" if no restraint is found. Do not use a table, a list or any other text.
  output_schema: ""
  output_type: str
  pipeline: universal
  condition: "'horizontal' in infringement_category_hor_vert_lic_joint"
  force_override: false
  run_state_active: false

- target_fact_name: infringement_subcategory_vertical_restraints
  question: |
    Task: Classify the business behavior provided below into the correct subcategory of vertical restraint.
    # Categories:
    * Exclusive Dealing / Market Foreclosure: Obligations requiring a buyer to purchase only from one supplier.
    * Territorial Exclusivity / Parallel Trade Bans: Restricting where a buyer can sell or preventing cross-border trade.
    * Resale Price Maintenance (RPM): Establishing fixed or minimum resale prices.
    * Bundling and Tying: Making the sale of one product conditional on the purchase of another.
    * Selective Distribution: Restricting sales to authorized distributors based on specific criteria.
    * Franchising: Licenses for IP/business models combined with vertical restrictions.
    * Discounts and Rebates: Financial incentives that may result in loyalty or exclusivity.
    Constraint: Your final answer must be the matching category name(s) on one line, separated by "; ", or "NA" if no restraint is found. Do not use a table, a list or any other text.
  output_schema: ""
  output_type: str
  pipeline: universal
  condition: "'vertical' in infringement_category_hor_vert_lic_joint"
  force_override: false
  run_state_active: false

- target_fact_name: market_oligopoly
  question: |
    Is the market dominated by a small number of large players (oligopoly) in the market?  
    # Constraint: reply with 'True' or 'False' or 'NA' in no info is provided .
  output_schema: ""
  pipeline: universal
  force_override: false
  run_state_active: false


- target_fact_name: decision_remedies
  question: "What orders did the Commission issue to terminate the infringement? List all remedies and orders, such as cease and desist orders, structural remedies (e.g., divestitures), behavioral remedies (e.g., commitments to change business practices) per company."
  output_schema: ""
  output_type: str
  pipeline: universal
  force_override: false
  run_state_active: false

- target_fact_name: infringement_gravity
  question: "How severe is the infringement? respond with one of the following categories: low, medium, high, NA. Consider factors such as the duration of the infringement, the market share of the involved companies, and the potential harm to consumers."
  output_schema: ""
  output_type: str
  pipeline: universal
  force_override: false
  run_state_active: false

# --------- book --------------
- target_fact_name: case_is_in_book
  question: "case id's is mentioned in the book"
  output_schema: ""
  output_type: str
  predecessors: []
  pipeline: book_keywords
  force_override: false
  run_state_active: false

- target_fact_name: case_is_landmark_in_book
  question: "case id's is mentioned in the book"
  output_schema: ""
  output_type: str
  predecessors: []
  condition: 'exists("case_is_in_book") '
  pipeline: book_landmark
  force_override: false
  run_state_active: false

- target_fact_name: case_infringement_type_book
  question: "cut from input the numbers and special characters from the and return as the infringement of case"
  output_schema: ""
  output_type: str
  predecessors: [case_is_in_book]
  condition: 'exists("case_is_in_book")'
  pipeline: book_infringement_type
  force_override: false
  run_state_active: false

- target_fact_name: case_infringement_book
  question: "infringement of case"
  output_schema: ""
  output_type: str
  predecessors: [case_is_in_book]
  condition: 'exists("case_is_in_book")'
  pipeline: book_universal
  force_override: false
  run_state_active: false

