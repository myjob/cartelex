- target_fact_name: OECD_sector
  question: "Which economic sector is involved? Choose the most fitting out of the following 10 OECD sectors:\nagriculture; \nmining;\nmanufacturing; \nelectricity and gas; \nconstruction; \ntrade (wholesaling and retailing) and hotels; \ntransport; \nbanking and insurance (including real estate); \ncommunication;\npublic service"
  output_schema: ""
  output_type: str
  predecessors: ["products"]
  # Classifies the sector FROM the products list (like its sibling
  # NACE_group_code). The `universal` pipeline ignores predecessors and does a
  # doc search instead, so the products context never reaches the LLM;
  # `fact_context` feeds it directly.
  pipeline: fact_context
  force_override: false
  run_state_active: false

# --------- market --------------
- target_fact_name: market_turbulence
  question: list market turbulence and uncertainties, if mentioned in the document. This includes any references to market volatility, economic instability, or other factors that could impact the competitive landscape. reply with "NA" if no market turbulence or uncertainties are mentioned.
  output_schema: "market_turbulence"
  output_type: str
  pipeline: universal
  force_override: false
  run_state_active: false

- target_fact_name: market_geographical
  question: In which countries is the geographical market located?
  output_schema: "country"
  pipeline: universal
  force_override: false
  run_state_active: false

- target_fact_name: market_outside_eu
  question: Is the geographical market including non European community members?
  predecessors: ["market_geographical"]
  output_schema: "bool"
  pipeline: "fact_context"
  force_override: false
  run_state_active: false

- target_fact_name: products
  question: list all products 
  output_schema: products
  pipeline: universal
  force_override: false
  run_state_active: false


